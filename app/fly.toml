# Fly.io settings for the public demo (docs/demo.md).
# Secrets are not here: set DEMO_PASSWORD and OPENROUTER_API_KEY with
# `fly secrets set`.

app = "demo-one"
primary_region = "arn"      # Stockholm; check with `fly platform regions`

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DEMO_MODE = "1"
  TALK_PROVIDER = "openrouter"
  # Fly's proxy writes this header itself, so it can be trusted for
  # per-IP limits.
  DEMO_CLIENT_IP_HEADER = "Fly-Client-IP"
  # A first visit opens this project of app/demo_seed/, by name.
  DEMO_START_PROJECT = "Building Project"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: sessions and sandboxes live in memory and in /tmp, so a
  # machine that stopped when idle would log everyone out. Fly advises
  # turning autostop and autostart off together.
  auto_stop_machines = "off"
  auto_start_machines = false

# One small machine. Sessions are per machine, so there must be exactly
# one: after the first deploy, check with `fly status` and run
# `fly scale count 1` if Fly created two.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
