# Settings for the development tools that read app/: pytest, Ruff, and
# mypy (docs/05-decisions.md #72, #74). Not packaging metadata.

[tool.pytest.ini_options]
testpaths = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# Errors, unused code, import order, modern syntax, common pitfalls.
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps code; long strings and comments stay unbroken.
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
files = ["backend", "server.py"]
# The app's own code: not the tests (they pass stand-ins on purpose), and
# not the parked Time code that nothing in the product uses (TODO.md 66).
exclude = ["^backend/foundation/", "test_[^/]*\\.py$", "conftest\\.py$"]
